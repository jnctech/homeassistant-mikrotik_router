name: Stale

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Stale
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@28ca1036281a5e5922ead5184a1bbf96e5fc984e  # v9.0.0
        with:
          stale-issue-message: "This issue has been automatically marked as stale because it has not had recent activity. It will be closed if no further activity occurs."
          stale-pr-message: "This PR has been automatically marked as stale because it has not had recent activity. PRs are never auto-closed; this is a nudge for the maintainer and author."
          close-issue-message: "This issue was closed because it has been stalled for 7 days with no activity."
          days-before-stale: 14
          days-before-close: 7
          # Contributor PRs often wait on maintainer review, not the author; never
          # auto-close them (the bot closed #138 mid-review). Issues still close.
          days-before-pr-close: -1
          exempt-issue-labels: "pinned,security,planned,help wanted"
          exempt-pr-labels: "pinned,security,planned,help wanted"
